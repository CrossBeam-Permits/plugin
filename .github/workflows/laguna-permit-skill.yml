name: Laguna permit plugin

# Model evals need one repository secret (Settings > Secrets and variables >
# Actions). Either works:
#   ANTHROPIC_API_KEY        Anthropic API key
#   CLAUDE_CODE_OAUTH_TOKEN  token from `claude setup-token`
# Without one, the model-evals job is skipped (grey), never green, and the run
# summary says model behavior was not verified. Pull requests from forks never
# receive secrets, so their model-evals job is always skipped.

on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "cities/laguna-beach/**"
      - "data/**"
      - "scripts/**"
      - "demos/laguna-pool/**"
      - ".github/workflows/laguna-permit-skill.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "cities/laguna-beach/**"
      - "data/**"
      - "scripts/**"
      - "demos/laguna-pool/**"
      - ".github/workflows/laguna-permit-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r cities/laguna-beach/requirements.txt
          npm install --global @anthropic-ai/claude-code
      - name: Check generated portal facts
        run: node scripts/sync-permit-portals.mjs --check
      - name: Verify operative Laguna law sources
        run: node scripts/check-laguna-law-sources.mjs --verify-remote
      - name: Regenerate semantic maps and require a clean diff
        run: |
          python cities/laguna-beach/scripts/author-semantic-maps.py
          git diff --exit-code -- cities/laguna-beach/assets/field-maps
      - name: Run deterministic contract and form-map evals
        working-directory: cities/laguna-beach
        run: python evals/run-evals.py
      - name: Test fictional browser demo transactions
        run: python -m unittest discover -s demos/laguna-pool -p "test_*.py" -v
      - name: Test host packaging helpers
        run: python -m unittest discover -s cities/laguna-beach/evals -p "test_*.py" -v
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate . --strict
          python cities/laguna-beach/scripts/validate-plugin.py --require-marketplace
      - name: Install into a throwaway Claude Code home and check the skill list
        run: bash cities/laguna-beach/evals/run-host-smoke.sh --host claude

  model-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.credentials.outputs.available }}
    steps:
      - id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Model evals skipped::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret. Model behavior is NOT verified."
            echo "Model behavior NOT VERIFIED: no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret. The model-evals job is skipped; deterministic success is not a release qualification." >> "$GITHUB_STEP_SUMMARY"
          fi

  model-evals:
    needs: [deterministic, model-availability]
    # A job skipped by `if` shows as skipped, not passed. Do not move this check
    # into a step: a job whose steps all skip reports success.
    if: ${{ needs.model-availability.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Run actual instruction behavior evals
        run: python cities/laguna-beach/evals/run-model-evals.py --output-dir model-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laguna-plugin-model-evals
          path: model-results
          if-no-files-found: error
