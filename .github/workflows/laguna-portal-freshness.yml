name: Laguna portal freshness

# Weekly read-only check that the plugin's pinned portal map still matches the
# City's live EnerGov catalog, plus the official form revisions where the City
# allows a headless download. GET requests only; no secrets are needed.
on:
  schedule:
    - cron: "41 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the pinned v2 portal map with the live City catalog
        working-directory: cities/laguna-beach
        run: >
          python scripts/check-portal-freshness.py --live
          --save-snapshot "$RUNNER_TEMP/portal-snapshot.json"
          --report "$RUNNER_TEMP/portal-drift.md"
          --json "$RUNNER_TEMP/portal-drift.json"
      - name: Publish the drift report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/portal-drift.md" ]; then
            cat "$RUNNER_TEMP/portal-drift.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Portal check did not produce a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laguna-portal-drift
          path: |
            ${{ runner.temp }}/portal-drift.md
            ${{ runner.temp }}/portal-drift.json
            ${{ runner.temp }}/portal-snapshot.json
          if-no-files-found: warn

  official-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install form tooling
        run: python -m pip install -r cities/laguna-beach/requirements.txt
      - name: Check official form revisions where a headless download is allowed
        working-directory: cities/laguna-beach
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          forms = json.load(open("assets/form-manifest.json"))["forms"]
          verified, unpinned, refused, drifted, broken = [], [], [], [], []
          for form in forms:
              receipt = temp / f"form-receipt-{form['id']}.json"
              result = subprocess.run(
                  [sys.executable, "scripts/check-source-freshness.py", "--manifest", "assets/form-manifest.json",
                   "--forms-dir", str(temp / "official-forms"), "--only", form["id"], "--fetch",
                   "--receipt", str(receipt)],
                  text=True, capture_output=True)
              # Classify from the script's own receipt, never from exit codes alone.
              if not receipt.is_file():
                  broken.append(form["id"])  # the check crashed before writing its receipt
                  print(result.stdout + result.stderr)
                  continue
              entries = json.loads(receipt.read_text())["forms"]
              status = entries[0]["status"] if entries else None
              if result.returncode == 0 and status == "current":
                  verified.append(form["id"])
              elif status == "drift":
                  drifted.append(form["id"])
                  print(result.stdout)
              elif status is not None:
                  unpinned.append(f"{form['id']} ({status})")  # manifest already says this form is not pinned
              else:
                  refused.append(form["id"])  # no PDF arrived: refused or a bot-check page
          lines = ["## Official Laguna forms", "",
                   f"- Verified against receipts: {', '.join(verified) or 'none'}",
                   f"- Not pinned in the manifest: {', '.join(unpinned) or 'none'}",
                   f"- Not verifiable headlessly (the City refused the download; check in a visible browser): {', '.join(refused) or 'none'}",
                   f"- Changed since the receipt: {', '.join(drifted) or 'none'}",
                   f"- Check failed to run: {', '.join(broken) or 'none'}", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines))
          print("\n".join(lines))
          if refused:
              print(f"::warning title=Official forms not verified::{len(refused)} form(s) could not be downloaded headlessly: {', '.join(refused)}")
          sys.exit(1 if drifted or broken else 0)
          PY
