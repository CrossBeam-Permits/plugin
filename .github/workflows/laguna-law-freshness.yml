name: Laguna law freshness

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify operative law receipts and review window
        run: node scripts/check-laguna-law-sources.mjs --verify-remote --enforce-review-window
