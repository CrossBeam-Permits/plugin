name: Laguna law freshness

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Two steps so a failure says which check failed: a changed ordinance PDF,
      # or an overdue human review of the current code pages.
      - name: Verify operative ordinance PDFs against their receipts
        run: node scripts/check-laguna-law-sources.mjs --verify-remote
      - name: Enforce the semantic law review window
        if: always()
        run: node scripts/check-laguna-law-sources.mjs --enforce-review-window
